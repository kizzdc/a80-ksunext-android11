name: A80 Samsung source - inspect IPA copy bug
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-a80-ipa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download and unpack Samsung source
        run: |
          set -euo pipefail
          mkdir -p incoming outer kernel reports
          gh release download samsung-a80-source --repo "$GITHUB_REPOSITORY" \
            --pattern 'SM-A805F_EUR_RR_Opensource*.zip' --dir incoming
          mapfile -d '' archives < <(find incoming -maxdepth 1 -name 'SM-A805F_EUR_RR_Opensource*.zip' -print0)
          test "${#archives[@]}" -eq 1
          unzip -q "${archives[0]}" -d outer
          tar -xf outer/Kernel.tar.gz -C kernel --no-same-owner --no-same-permissions
      - name: Inspect IPA source and Wi-Fi header
        run: |
          set -euo pipefail
          {
            echo '=== IPA function ==='
            sed -n '1995,2115p' kernel/drivers/platform/msm/ipa/ipa_v3/ipa_hw_stats.c
            echo '=== IPA uses of copy_from_user and size ==='
            grep -n -E 'ipa_debugfs_enable_disable_drop_stats|copy_from_user' kernel/drivers/platform/msm/ipa/ipa_v3/ipa_hw_stats.c | tail -n 32
            echo '=== Wi-Fi function declaration / definition ==='
            sed -n '13245,13280p' kernel/drivers/net/wireless/qualcomm/wcn39xx/qcacld-3.0/core/sme/src/common/sme_api.c
            sed -n '2095,2113p' kernel/drivers/net/wireless/qualcomm/wcn39xx/qcacld-3.0/core/sme/inc/sme_api.h
          } | tee reports/ipa-source-diagnostic.txt
      - name: Inspect ARM64 linker and source toolchain requirements
        run: |
          set -euo pipefail
          {
            echo '=== Samsung official build instructions ==='
            cat outer/README_Kernel.txt
            echo '=== Build kernel Makefile compiler/linker cases ==='
            sed -n '368,423p' kernel/Makefile
            sed -n '476,530p' kernel/Makefile
            sed -n '670,695p' kernel/Makefile
            echo '=== Source package contents ==='
            find outer -maxdepth 2 -type f -printf '%p %s bytes\n' | head -n 50
            echo '=== Main kernel ARM64 toolchain flags ==='
            grep -nE '^(CC|LD|AS|KBUILD_(CFLAGS|LDFLAGS)|LDFLAGS(_vmlinux)?|KBUILD_AFLAGS|CLANG|LLVM|GCC|CONFIG_(ARM64|MODULE_REL_CRCS))|(-fpie|-fpic|-mcmodel|-shared|-no-pie|--no-apply-dynamic-relocs|--no-undefined)' kernel/Makefile | head -n 100 || true
            echo '=== arch/arm64/Makefile ==='
            sed -n '1,230p' kernel/arch/arm64/Makefile
            echo '=== linker script GSI exports and special sections ==='
            grep -R -n -m 12 'bss.rtic\|__crc_gsi_write_channel_scratch\|gsi_write_channel_scratch' kernel/arch/arm64/kernel/vmlinux.lds.S kernel/drivers/platform/msm/gsi kernel/security/selinux kernel/include/asm-generic/vmlinux.lds.h | head -n 50 || true
            echo '=== source build instructions ==='
            find outer kernel -maxdepth 2 -type f \( -iname '*readme*' -o -iname '*build*.sh' \) | head -n 60
            echo '=== Toolchain installed / expected hints ==='
            grep -R -n -m 2 -iE 'clang|aarch64-linux-gnu-gcc|linaro|gcc.*4\.9|GCC.*version' kernel/build* kernel/README* outer/README* 2>/dev/null | head -n 80 || true
          } | tee reports/arm64-toolchain-diagnostic.txt
      - name: Upload diagnostic source excerpts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a80-ipa-diagnostic-${{ github.run_number }}
          path: reports/
          retention-days: 7
