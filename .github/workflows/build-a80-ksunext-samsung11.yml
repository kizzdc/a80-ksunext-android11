name: A80 Android 11 KernelSU Next - integration test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-a80-ksunext-samsung11.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release holding SM-A805F official Samsung source'
        type: string
        required: true
        default: 'samsung-a80-source'

permissions:
  contents: read

concurrency:
  group: a80-samsung11-ksunext-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    name: Linux 4.14.190 KernelSU Next integration (NOT flashable)
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag || 'samsung-a80-source' }}
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
      CROSS_COMPILE_COMPAT: arm-linux-gnueabi-
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install cross-compiler and kernel dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex python3 unzip xz-utils \
            libssl-dev libelf-dev libncurses-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu clang-14 lld-14 llvm-14 ccache

      - name: Download official Samsung A80 kernel source
        run: |
          set -euo pipefail
          mkdir -p incoming outer kernel out reports
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'SM-A805F_EUR_RR_Opensource*.zip' --dir incoming
          mapfile -d '' source_files < <(find incoming -maxdepth 1 -type f \
            -name 'SM-A805F_EUR_RR_Opensource*.zip' -print0)
          (( ${#source_files[@]} == 1 )) || {
            echo "::error::Expected exactly one Samsung source zip asset"
            exit 1
          }
          sha256sum "${source_files[0]}" | tee reports/official-source-sha256.txt
          unzip -tq "${source_files[0]}" | tee reports/archive-integrity.txt
          unzip -q "${source_files[0]}" -d outer
          kernel_tar=$(find outer -maxdepth 3 -type f -iname 'Kernel.tar.gz' -print -quit)
          test -n "$kernel_tar"
          echo "Extracting $kernel_tar"
          tar -xf "$kernel_tar" -C kernel --no-same-owner --no-same-permissions
          test -f kernel/Makefile
          test -f kernel/arch/arm64/configs/r1q_eur_open_defconfig
          grep -Eq '^VERSION[[:space:]]*=[[:space:]]*4[[:space:]]*$' kernel/Makefile
          grep -Eq '^PATCHLEVEL[[:space:]]*=[[:space:]]*14[[:space:]]*$' kernel/Makefile
          grep -Eq '^SUBLEVEL[[:space:]]*=[[:space:]]*190[[:space:]]*$' kernel/Makefile
          {
            echo 'A805FXXU7DXE1 Samsung official source. Linux 4.14.190.'
            echo 'This run is only a baseline compile; no KernelSU has been integrated.'
            echo 'DO NOT FLASH output on the device; boot configuration not validated.'
          } | tee reports/NOT_FLASHABLE.txt

      - name: Diagnose and repair Samsung inline declaration (GCC compatibility)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          name = 'need_memory_boosting'
          paths = [
              Path('kernel/include/linux/mm.h'),
              Path('kernel/mm/page_alloc.c'),
              Path('kernel/mm/vmscan.c'),
          ]
          with open('reports/inline-diagnostic.txt', 'w') as report:
              for p in paths:
                  print(f'=== {p} ===', file=report)
                  if not p.exists():
                      print('MISSING', file=report)
                      continue
                  lines = p.read_text(errors='replace').splitlines()
                  for i, line in enumerate(lines):
                      if name in line:
                          for j in range(max(0, i-3), min(len(lines), i+6)):
                              print(f'{j+1}: {lines[j]}', file=report)
                          print('---', file=report)
          print(Path('reports/inline-diagnostic.txt').read_text())
          import stat
          edits = [
              (
                  Path('kernel/include/linux/mm.h'),
                  'extern inline bool need_memory_boosting(struct pglist_data *pgdat);',
                  'extern bool need_memory_boosting(struct pglist_data *pgdat);'
              ),
              (
                  Path('kernel/mm/vmscan.c'),
                  'inline bool need_memory_boosting(struct pglist_data *pgdat)',
                  'bool need_memory_boosting(struct pglist_data *pgdat)'
              )
          ]
          # Samsung ships read-only source files. Set writable only in ephemeral runner.
          for path, original, replacement in edits:
              contents = path.read_text()
              if contents.count(original) != 1:
                  raise SystemExit('Unexpected function text in ' + str(path))
              path.chmod(path.stat().st_mode | stat.S_IWUSR)
              path.write_text(contents.replace(original, replacement, 1))
              print('Compile-only inline compatibility adjusted:', path)
          print('No changes were made to the uploaded official Samsung ZIP')
          PY

      - name: Fix Samsung driver compile errors in disposable source tree
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import stat
          edits = [
              (
                  'kernel/sound/soc/codecs/tfa9894/tfa9xxx_haptic.c',
                  [
                      ('drv->pbq_state == TFA_PBQ_STATE_IDLE;', 'drv->pbq_state = TFA_PBQ_STATE_IDLE;', 1),
                      ('drv->pbq_state == TFA_PBQ_STATE_TIMEOUT;', 'drv->pbq_state = TFA_PBQ_STATE_TIMEOUT;', 1),
                      ('pr_info("[VIB] %s: pbq_str_tok: %s\\n", pbq_str_tok);',
                       'pr_info("[VIB] %s: pbq_str_tok: %s\\n", __func__, pbq_str_tok);', 1),
                  ]
              ),
              (
                  'kernel/techpack/audio/asoc/msm-pcm-routing-v2.c',
                  [('static const int const ', 'static const int ', 7)]
              ),
              (
                  'kernel/drivers/input/touchscreen/imagis_40xx/ist40xx_sec.c',
                  [('char buff[msg_len] = {0, };', 'char buff[128] = {0, };', 1)]
              )
          ]
          out = Path('reports/source-compat-patches.txt')
          with out.open('w') as report:
              for filename, replacements in edits:
                  p = Path(filename)
                  contents = p.read_text()
                  if filename.endswith('ist40xx_sec.c') and 'const int msg_len = 128;' not in contents:
                      raise SystemExit('Unexpected msg_len; inspect Samsung source before changing.')
                  for old, new, count in replacements:
                      actual = contents.count(old)
                      if actual != count:
                          print(f'UNEXPECTED: {filename} expected {count} copies of {old!r}, found {actual}', file=report)
                          raise SystemExit('Source mismatch; refusing an unverified edit')
                      contents = contents.replace(old, new)
                      print(f'{filename}: {old!r} -> {new!r} (x{count})', file=report)
                  p.chmod(p.stat().st_mode | stat.S_IWUSR)
                  p.write_text(contents)
          print(out.read_text())
          PY

      - name: Fix IPA bounded debugfs copy and Wi-Fi API signature
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import stat
          patches = [
              (
                  Path('kernel/drivers/platform/msm/ipa/ipa_v3/ipa_hw_stats.c'),
                  [
                      ('if (sizeof(dbg_buff) < count + 1) {',
                       'if (count >= sizeof(dbg_buff)) {'),
                      ('missing = copy_from_user(dbg_buff, ubuf, count);',
                       'missing = copy_from_user(dbg_buff, ubuf, min(count, sizeof(dbg_buff) - 1));'),
                  ],
              ),
              (
                  Path('kernel/drivers/net/wireless/qualcomm/wcn39xx/qcacld-3.0/core/sme/src/common/sme_api.c'),
                  [
                      ('QDF_STATUS sme_create_mon_session(mac_handle_t mac_handle, tSirMacAddr bss_id,',
                       'QDF_STATUS sme_create_mon_session(mac_handle_t mac_handle, uint8_t *bss_id,'),
                  ],
              ),
          ]
          with open('reports/ipa-wifi-patch.txt', 'w') as report:
              for target, edits in patches:
                  src = target.read_text()
                  if target.name == 'ipa_hw_stats.c':
                      # Scope to the function containing the single unbounded copy.
                      copy_call = 'missing = copy_from_user(dbg_buff, ubuf, count);'
                      guard = 'if (sizeof(dbg_buff) < count + 1) {'
                      if src.count(copy_call) != 1:
                          raise SystemExit('IPA call missing or duplicated')
                      call_pos = src.index(copy_call)
                      guard_pos = src.rfind(guard, 0, call_pos)
                      if guard_pos < 0 or call_pos - guard_pos > 500:
                          raise SystemExit('No matching IPA guard near unsafe copy')
                      src = (src[:guard_pos] +
                             'if (count >= sizeof(dbg_buff)) {' +
                             src[guard_pos + len(guard):])
                      print('%s: fixed only the guard immediately preceding the affected copy' %
                            target, file=report)
                      edits = edits[1:] # guard already patched with precise location
                  for old, new in edits:
                      occurrences = src.count(old)
                      if occurrences != 1:
                          raise SystemExit('Unexpected source layout in %s: %r count %d' %
                                           (target, old, occurrences))
                      src = src.replace(old, new, 1)
                      print('%s: %s => %s' % (target, old, new), file=report)
                  target.chmod(target.stat().st_mode | stat.S_IWUSR)
                  target.write_text(src)
          print(Path('reports/ipa-wifi-patch.txt').read_text())
          PY

      - name: Repair missing Samsung memshare function return type
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import stat
          p = Path('kernel/drivers/soc/qcom/memshare/msm_memshare.c')
          before = 'extern sec_reserved_mem(void);'
          after = 'extern int sec_reserved_mem(void);'
          content = p.read_text()
          if content.count(before) != 1:
              raise SystemExit('Unexpected msm_memshare.c source; do not patch blindly')
          p.chmod(p.stat().st_mode | stat.S_IWUSR)
          p.write_text(content.replace(before, after, 1))
          print('Temporary compile-only fix: implicit int -> explicit int.')
          with open('reports/memshare-patch.txt', 'w') as report:
              print('%s: %s -> %s' % (p, before, after), file=report)
          PY

      - name: Fix USB PD strict prototypes (Samsung source only)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import stat
          p = Path('kernel/drivers/usb/pd/policy_engine.c')
          substitutions = [
              ('unsigned int get_pd_max_power()', 'unsigned int get_pd_max_power(void)'),
              ('int get_pd_cap_count()', 'int get_pd_cap_count(void)'),
              ('bool get_ps_ready_status()', 'bool get_ps_ready_status(void)'),
              ('pr_info("%s : phy_driver_data is null!\\n");',
               'pr_info("%s : phy_driver_data is null!\\n", __func__);'),
          ]
          src = p.read_text()
          with open('reports/usb-pd-patch.txt', 'w') as report:
              for before, after in substitutions:
                  num = src.count(before)
                  if num != 1:
                      raise SystemExit(f'Unexpected Samsung USB PD source: {before!r} appeared {num} times')
                  src = src.replace(before, after, 1)
                  print(f'{before} -> {after}', file=report)
          p.chmod(p.stat().st_mode | stat.S_IWUSR)
          p.write_text(src)
          print(Path('reports/usb-pd-patch.txt').read_text())
          PY

      - name: Integrate KernelSU Next in disposable Samsung source
        run: |
          set -euo pipefail
          cd kernel
          chmod u+w drivers/Makefile drivers/Kconfig
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
            -o /tmp/ksunext-setup.sh
          bash /tmp/ksunext-setup.sh legacy
          test -d KernelSU-Next/kernel
          grep -Fq 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile
          grep -Fq 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          test -L drivers/kernelsu
          git -C KernelSU-Next rev-parse HEAD | tee ../reports/ksunext-revision.txt

      - name: Configure Samsung A80 defconfig
        run: |
          set -euo pipefail
          # Samsung recommends Qualcomm Clang 10; Ubuntu Clang 14 is a diagnostic
          # alternative to GCC 11. Explicit lld avoids GNU ld relocation behavior.
          clang-14 --version | head -n 1 | tee reports/toolchain-version.txt
          ld.lld-14 --version | tee -a reports/toolchain-version.txt
          make -C kernel O="$GITHUB_WORKSPACE/out" \
            CC=clang-14 LD=ld.lld-14 HOSTCC=gcc \
            AR=llvm-ar-14 NM=llvm-nm-14 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            r1q_eur_open_defconfig 2>&1 | tee reports/configure.log
          # Diagnostic-only: Samsung GSI export lacks a valid CRC under Clang 14,
          # causing R_AARCH64_ABS32 at vmlinux link. Disable symbol CRC versioning
          # only in the disposable runner config to isolate this toolchain issue.
          if grep -qx 'CONFIG_MODVERSIONS=y' out/.config; then
            kernel/scripts/config --file out/.config -d MODVERSIONS
            make -C kernel O="$GITHUB_WORKSPACE/out" \
              CC=clang-14 LD=ld.lld-14 HOSTCC=gcc \
              AR=llvm-ar-14 NM=llvm-nm-14 \
              CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig
            echo 'Diagnostic only: disabled CONFIG_MODVERSIONS for Clang 14 baseline linking.' | tee reports/modversions-diagnostic.txt
          else
            echo 'CONFIG_MODVERSIONS not enabled; no diagnostic change.' | tee reports/modversions-diagnostic.txt
          fi
          # Linux 4.14: test manual hook prerequisites; do not pretend hooks exist.
          kernel/scripts/config --file out/.config -e KSU -e KSU_MANUAL_HOOK
          if ! grep -q 'ksu_handle_sys_reboot' kernel/kernel/reboot.c; then
            echo 'Manual hook integration incomplete; collecting full context for a reviewed patch.' | tee reports/manual-hook-assessment.txt
            for file in kernel/reboot.c fs/exec.c fs/open.c fs/read_write.c fs/stat.c fs/namespace.c; do
              if [[ -f "kernel/$file" ]]; then
                echo "===== $file =====" >> reports/manual-hook-assessment.txt
                grep -nE -C 8 'SYSCALL_DEFINE|do_execve|do_faccessat|vfs_read|vfs_stat|do_umount|kernel_restart' "kernel/$file" >> reports/manual-hook-assessment.txt || true
                mkdir -p "reports/source-context/$(dirname "$file")"
                cp "kernel/$file" "reports/source-context/$file"
              fi
            done
            echo '===== KernelSU manual hook API references =====' >> reports/manual-hook-assessment.txt
            grep -R -nE 'ksu_handle_(execveat|faccessat|stat|read|sys_reboot|vfs_read|setuid)' kernel/KernelSU-Next/kernel --include='*.h' --include='*.c' | head -n 220 >> reports/manual-hook-assessment.txt || true
            echo '===== Samsung syscall signatures =====' >> reports/manual-hook-assessment.txt
            grep -nE 'SYSCALL_DEFINE[0-6]\\((execve|execveat|faccessat|read|newfstatat|reboot)|do_execveat_common|do_faccessat' kernel/fs/{exec,open,read_write,stat}.c kernel/kernel/reboot.c >> reports/manual-hook-assessment.txt || true
            echo '===== Full KernelSU hook function declarations and bodies =====' >> reports/manual-hook-assessment.txt
            for file in kernel/KernelSU-Next/kernel/core/init.c kernel/KernelSU-Next/kernel/feature/sucompat.c kernel/KernelSU-Next/kernel/runtime/ksud_integration.c kernel/KernelSU-Next/kernel/supercall/supercall.c kernel/KernelSU-Next/kernel/feature/sucompat.h; do
              if [[ -f "$file" ]]; then
                mkdir -p "reports/ksu-hook-context/$(dirname "${file#kernel/KernelSU-Next/kernel/}")"
                cp "$file" "reports/ksu-hook-context/${file#kernel/KernelSU-Next/kernel/}"
              fi
            done
            echo '===== Manual hook ABI contract =====' > reports/manual-hook-abi-contract.txt
            for item in 'core/init.c:ksu_handle_execveat' 'feature/sucompat.c:ksu_handle_faccessat' 'feature/sucompat.c:ksu_handle_stat' 'supercall/supercall.c:ksu_handle_sys_reboot' 'runtime/ksud_integration.c:ksu_handle_sys_read'; do
              file="${item%%:*}"
              symbol="${item#*:}"
              echo "===== $symbol ($file) =====" >> reports/manual-hook-abi-contract.txt
              grep -n -A 16 -B 4 "$symbol(" "kernel/KernelSU-Next/kernel/$file" | head -n 55 >> reports/manual-hook-abi-contract.txt || true
            done
            echo '===== Samsung call site contract =====' >> reports/manual-hook-abi-contract.txt
            grep -n -A 14 -B 3 -E 'SYSCALL_DEFINE4\\(reboot|SYSCALL_DEFINE3\\(faccessat|do_execveat_common\\(' kernel/kernel/reboot.c kernel/fs/open.c kernel/fs/exec.c | head -n 180 >> reports/manual-hook-abi-contract.txt || true
          echo '===== Reboot hook patch dry-run (runner copy only) =====' >> reports/manual-hook-assessment.txt
          python3 - <<'PY'
          from pathlib import Path
          import stat
          p = Path('kernel/kernel/reboot.c')
          src = p.read_text()
          import re
          matches = list(re.finditer(r'SYSCALL_DEFINE4\s*\(\s*reboot\s*,', src))
          if len(matches) != 1:
              raise SystemExit(f'Expected one reboot syscall, found {len(matches)}')
          start = matches[0].start()
          anchor_match = re.search(r'/\*\s*We only trust the superuser with rebooting the system\.\s*\*/', src[start:start+1600])
          if not anchor_match:
              raise SystemExit('Reboot capability-check anchor mismatch')
          idx = start + anchor_match.start()
          declaration = '''#ifdef CONFIG_KSU_MANUAL_HOOK
          extern int ksu_handle_sys_reboot(int magic1, int magic2, unsigned int cmd,
                               void __user **arg);
          #endif

          '''
          if 'ksu_handle_sys_reboot' in src:
              raise SystemExit('Reboot hook already exists; refusing duplicate')
          src = src[:start] + declaration + src[start:]
          idx = src.find(anchor_match.group(0), start+len(declaration))
          if idx < 0:
              raise SystemExit('Reboot anchor vanished after insertion')
          hook = '''#ifdef CONFIG_KSU_MANUAL_HOOK
              /* KernelSU supercall magic, not Linux's reboot magic. */
              if ((unsigned int)magic1 == 0xDEADBEEF) {
                  ksu_handle_sys_reboot(magic1, magic2, cmd, &arg);
                  return 0;
              }
          #endif
          '''
          src = src[:idx] + hook + src[idx:]
          p.chmod(p.stat().st_mode | stat.S_IWUSR)
          p.write_text(src)
          Path('reports/reboot-hook-dry-run.txt').write_text(
              'Injected KSU manual reboot hook into disposable runner source.\\n'
              'Preserved normal reboot CAP_SYS_BOOT validation.\\n'
              'Other hooks not installed; no build and NOT FLASHABLE.\\n')
          print('Reboot hook dry-run completed')
          PY
            echo '===== Compile patched reboot object (isolated diagnostic) =====' | tee reports/reboot-compile.txt
            make -C kernel O="$GITHUB_WORKSPACE/out" \
              CC=clang-14 LD=ld.lld-14 HOSTCC=gcc \
              AR=llvm-ar-14 NM=llvm-nm-14 \
              CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig 2>&1 | tee -a reports/reboot-compile.txt
            grep -qx 'CONFIG_KSU=y' out/.config || {
              echo 'CONFIG_KSU is not enabled; aborting object check' | tee -a reports/reboot-compile.txt
              exit 1
            }
            grep -qx 'CONFIG_KSU_MANUAL_HOOK=y' out/.config || {
              echo 'CONFIG_KSU_MANUAL_HOOK is not enabled' | tee -a reports/reboot-compile.txt
              exit 1
            }
            set +e
            make -C kernel O="$GITHUB_WORKSPACE/out" \
              CC=clang-14 LD=ld.lld-14 HOSTCC=gcc \
              AR=llvm-ar-14 NM=llvm-nm-14 \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              KCFLAGS='-Wno-error=unused-but-set-variable -gdwarf-4' \
              -j2 kernel/reboot.o > reports/reboot-object-build.log 2>&1
            reboot_rc=$?
            set -e
            tail -n 80 reports/reboot-object-build.log | tee -a reports/reboot-compile.txt
            echo "Reboot object compile exit code: $reboot_rc" | tee -a reports/reboot-compile.txt
            echo '===== Verify compiled reboot object contains KernelSU call =====' | tee -a reports/reboot-compile.txt
            if [[ "$reboot_rc" -eq 0 ]]; then
              llvm-nm-14 out/kernel/reboot.o | grep -E 'ksu_handle_sys_reboot|__arm64_sys_reboot|sys_reboot' | tee reports/reboot-symbols.txt || true
              if ! llvm-nm-14 -u out/kernel/reboot.o | grep -q 'ksu_handle_sys_reboot'; then
                echo 'WARNING: compiled reboot.o has no unresolved KernelSU reboot hook reference' | tee -a reports/reboot-compile.txt
              fi
            fi
            echo '===== Compile remaining Samsung hook call-site objects (unmodified) =====' | tee reports/manual-hook-object-audit.txt
            for target in fs/exec.o fs/open.o fs/read_write.o fs/stat.o fs/namespace.o; do
              set +e
              make -C kernel O="$GITHUB_WORKSPACE/out" \
                CC=clang-14 LD=ld.lld-14 HOSTCC=gcc \
                AR=llvm-ar-14 NM=llvm-nm-14 \
                CLANG_TRIPLE=aarch64-linux-gnu- \
                KCFLAGS='-Wno-error=unused-but-set-variable -gdwarf-4' \
                -j2 "$target" > "reports/${target//\//-}.log" 2>&1
              rc=$?
              set -e
              echo "$target compile exit code: $rc" | tee -a reports/manual-hook-object-audit.txt
              if [[ "$rc" -ne 0 ]]; then
                tail -n 35 "reports/${target//\//-}.log" >> reports/manual-hook-object-audit.txt
              fi
            done
            echo '===== Prepare generated SELinux headers for isolated KSU build =====' | tee reports/selinux-header-prep.txt
            set +e
            make -C kernel O="$GITHUB_WORKSPACE/out" \
              CC=clang-14 LD=ld.lld-14 HOSTCC=gcc \
              AR=llvm-ar-14 NM=llvm-nm-14 \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              -j2 security/selinux/ > reports/selinux-header-make.log 2>&1
            selinux_prep_rc=$?
            set -e
            echo "SELinux header generation exit code: $selinux_prep_rc" | tee -a reports/selinux-header-prep.txt
            tail -n 35 reports/selinux-header-make.log | tee -a reports/selinux-header-prep.txt
            find kernel/security/selinux out/security/selinux -maxdepth 3 \
              \( -name flask.h -o -name av_permissions.h \) -print 2>/dev/null | tee -a reports/selinux-header-prep.txt || true
            echo '===== KernelSU Next legacy object compilation audit =====' | tee reports/ksu-object-audit.txt
            set +e
            make -C kernel O="$GITHUB_WORKSPACE/out" \
              CC=clang-14 LD=ld.lld-14 HOSTCC=gcc \
              AR=llvm-ar-14 NM=llvm-nm-14 \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              KCFLAGS='-Wno-error=unused-but-set-variable -gdwarf-4' \
              -j2 drivers/kernelsu/ > reports/ksu-object-build.log 2>&1
            ksu_rc=$?
            set -e
            echo "KernelSU Next objects compile exit code: $ksu_rc" | tee -a reports/ksu-object-audit.txt
            tail -n 100 reports/ksu-object-build.log | tee -a reports/ksu-object-audit.txt
            echo '===== Inspect KernelSU object linkage and required manual-hook symbols =====' | tee reports/ksu-symbol-audit.txt
            find out/drivers/kernelsu -name '*.o' -type f | sort > reports/ksu-object-list.txt
            while IFS= read -r object; do
              llvm-nm-14 -u "$object" 2>/dev/null | grep -E 'ksu_handle_|ksu_|security_|selinux_' | sed "s|^|$object: |" || true
            done < reports/ksu-object-list.txt | tee -a reports/ksu-symbol-audit.txt
            echo '===== Confirm generated SELinux headers =====' >> reports/ksu-symbol-audit.txt
            test -s out/security/selinux/flask.h && echo 'flask.h exists' >> reports/ksu-symbol-audit.txt
            test -s out/security/selinux/av_permissions.h && echo 'av_permissions.h exists' >> reports/ksu-symbol-audit.txt
            echo '===== Cross-check KernelSU symbol definitions across every object =====' | tee reports/ksu-resolution-audit.txt
            : > reports/ksu-defined-symbols.txt
            : > reports/ksu-undefined-symbols.txt
            while IFS= read -r object; do
              llvm-nm-14 --defined-only "$object" 2>/dev/null | grep -E 'ksu_handle_|ksu_|supercall' >> reports/ksu-defined-symbols.txt || true
              llvm-nm-14 -u "$object" 2>/dev/null | awk '{print $NF}' | grep -E '^ksu_' >> reports/ksu-undefined-symbols.txt || true
            done < reports/ksu-object-list.txt
            sort -u -o reports/ksu-undefined-symbols.txt reports/ksu-undefined-symbols.txt
            while IFS= read -r symbol; do
              if awk -v name="$symbol" '$NF == name && $2 ~ /^[TWDBR]$/ {found=1} END {exit !found}' reports/ksu-defined-symbols.txt; then
                echo "DEFINED_IN_KSU_OBJECTS $symbol" >> reports/ksu-resolution-audit.txt
              else
                echo "NOT_DEFINED_IN_KSU_OBJECTS $symbol" >> reports/ksu-resolution-audit.txt
              fi
            done < reports/ksu-undefined-symbols.txt
            echo '===== Samsung hook site function and nearby source =====' >> reports/ksu-resolution-audit.txt
            for spec in 'fs/exec.c:do_execveat_common' 'fs/open.c:do_faccessat' 'fs/read_write.c:SYSCALL_DEFINE3(read' 'fs/stat.c:vfs_statx' 'fs/namespace.c:SYSCALL_DEFINE2(umount'; do
              file="${spec%%:*}"
              symbol="${spec#*:}"
              echo "--- $file $symbol ---" >> reports/ksu-resolution-audit.txt
              grep -n -F -A 12 -B 4 "$symbol" "kernel/$file" | head -n 95 >> reports/ksu-resolution-audit.txt || true
            done
            echo '===== KernelSU symbol resolution audit results ====='
            cat reports/ksu-resolution-audit.txt
            echo '===== KernelSU unresolved symbols (cross-object) ====='
            cat reports/ksu-undefined-symbols.txt
            echo '===== Samsung hook insertion context ====='
            grep -A 110 'Samsung hook site function' reports/ksu-resolution-audit.txt | head -n 220 || true
            echo '===== Verify actual KernelSU manual-hook definitions and call sites =====' | tee reports/manual-hook-gap.txt
            for symbol in ksu_handle_execveat_ksud ksu_handle_execveat_sucompat ksu_handle_setresuid ksu_handle_umount ksu_handle_sys_reboot; do
              echo "--- $symbol: definitions in compiled KernelSU objects ---" | tee -a reports/manual-hook-gap.txt
              while IFS= read -r obj; do
                llvm-nm-14 --defined-only "$obj" 2>/dev/null | awk -v sym="$symbol" '$NF == sym {print}' | sed "s|^|$obj: |" || true
              done < reports/ksu-object-list.txt | tee -a reports/manual-hook-gap.txt
              echo "--- $symbol: call sites in Samsung kernel sources ---" | tee -a reports/manual-hook-gap.txt
              grep -R -n -F "$symbol" kernel/kernel/reboot.c kernel/fs/exec.c kernel/fs/open.c kernel/fs/read_write.c kernel/fs/stat.c kernel/fs/namespace.c 2>/dev/null | head -n 12 | tee -a reports/manual-hook-gap.txt || true
            done
            echo '===== KernelSU manual-hook source declarations =====' | tee -a reports/manual-hook-gap.txt
            grep -R -n -E 'ksu_handle_(execveat_ksud|execveat_sucompat|setresuid|umount|sys_reboot)' kernel/KernelSU-Next/kernel --include='*.h' --include='*.c' 2>/dev/null | head -n 90 | tee -a reports/manual-hook-gap.txt || true
            echo '===== Effective KernelSU hook configuration =====' | tee reports/hook-mode-audit.txt
            grep -E '^CONFIG_(KSU|KSU_MANUAL_HOOK|KSU_KPROBES_HOOK|KSU_SYSCALL_TABLE_HOOK|SECURITY_SELINUX|SECURITY)=' out/.config | tee -a reports/hook-mode-audit.txt || true
            echo '===== Compiled KernelSU hook-related symbols =====' | tee -a reports/hook-mode-audit.txt
            llvm-nm-14 --defined-only out/drivers/kernelsu/built-in.o 2>/dev/null | grep -E 'ksu_handle_execveat|ksu_handle_setresuid|ksu_handle_umount|ksu_handle_sys_reboot|ksu_hook_init|ksu_lsm_hook_init' | tee -a reports/hook-mode-audit.txt || true
            echo '===== Samsung kernel exec/setuid syscall entry points =====' | tee -a reports/hook-mode-audit.txt
            for file in kernel/fs/exec.c kernel/kernel/sys.c kernel/fs/namespace.c; do
              echo "--- $file ---" | tee -a reports/hook-mode-audit.txt
              grep -n -E 'do_execveat_common|SYSCALL_DEFINE[0-9]\((execve|execveat|setresuid|umount)|commit_creds|set_current_cred' "$file" | head -n 65 | tee -a reports/hook-mode-audit.txt || true
            done
            echo '===== KernelSU exec hook function signature and call chain =====' | tee reports/manual-hook-insertion-context.txt
            sed -n '15,65p' kernel/KernelSU-Next/kernel/core/init.c | tee -a reports/manual-hook-insertion-context.txt
            sed -n '20,55p' kernel/KernelSU-Next/kernel/runtime/ksud.h | tee -a reports/manual-hook-insertion-context.txt
            sed -n '1,65p' kernel/KernelSU-Next/kernel/hook/setuid_hook.h | tee -a reports/manual-hook-insertion-context.txt
            echo '===== Samsung do_execveat_common =====' | tee -a reports/manual-hook-insertion-context.txt
            sed -n '1830,1905p' kernel/fs/exec.c | tee -a reports/manual-hook-insertion-context.txt
            echo '===== Samsung setresuid =====' | tee -a reports/manual-hook-insertion-context.txt
            sed -n '595,670p' kernel/kernel/sys.c | tee -a reports/manual-hook-insertion-context.txt
            echo '===== Samsung umount =====' | tee -a reports/manual-hook-insertion-context.txt
            sed -n '2170,2225p' kernel/fs/namespace.c | tee -a reports/manual-hook-insertion-context.txt
            echo '===== Validate proposed exec hook ABI without modifying Samsung source =====' | tee reports/exec-hook-abi.txt
            grep -n -A 22 -B 4 'int ksu_handle_execveat(' kernel/KernelSU-Next/kernel/core/init.c | tee -a reports/exec-hook-abi.txt || true
            grep -n -A 16 -B 3 'static int do_execveat_common(' kernel/fs/exec.c | tee -a reports/exec-hook-abi.txt || true
            echo '===== Full setresuid commit path =====' | tee -a reports/exec-hook-abi.txt
            sed -n '625,665p' kernel/kernel/sys.c | tee -a reports/exec-hook-abi.txt
            echo '===== Current KSU hook mode constraints =====' | tee -a reports/exec-hook-abi.txt
            grep -R -n -E 'CONFIG_KSU_MANUAL_HOOK|ksu_handle_execveat\(' kernel/KernelSU-Next/kernel/Kbuild kernel/KernelSU-Next/kernel/core/init.c kernel/KernelSU-Next/kernel/Kconfig | tee -a reports/exec-hook-abi.txt || true
            echo '===== Test temporary execveat manual hook compile (runner only) =====' | tee reports/exec-hook-compile.txt
            python3 - <<'PY' 
            from pathlib import Path
            p = Path('kernel/fs/exec.c')
            src = p.read_text()
            needle = 'static int do_execveat_common(int fd, struct filename *filename,'
            assert src.count(needle) == 1, 'unexpected execveat function signature'
            prototype = 'extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv, void *envp, int *flags);\n'
            src = src.replace(needle, '#ifdef CONFIG_KSU_MANUAL_HOOK\n' + prototype + '#endif\n' + needle, 1)
            start = src.index(needle)
            tail = src[start:]
            guard = '\tif (IS_ERR(filename))\n\t\treturn PTR_ERR(filename);\n'
            assert tail.count(guard) == 1, 'unexpected execveat error guard'
            call = '\n#ifdef CONFIG_KSU_MANUAL_HOOK\n\tksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);\n#endif\n'
            tail = tail.replace(guard, guard + call, 1)
            p.write_text(src[:start] + tail)
            PY
            set +e
            make -C kernel O="$GITHUB_WORKSPACE/out" CC=clang-14 LD=ld.lld-14 HOSTCC=gcc AR=llvm-ar-14 NM=llvm-nm-14 CLANG_TRIPLE=aarch64-linux-gnu- fs/exec.o > reports/exec-hook-compile-build.log 2>&1
            exec_hook_rc=$?
            set -e
            echo "Temporary execveat hook compile exit code: $exec_hook_rc" | tee -a reports/exec-hook-compile.txt
            tail -n 45 reports/exec-hook-compile-build.log | tee -a reports/exec-hook-compile.txt
            echo 'Temporary execveat hook is compile-only and NOT boot-validated. NOT FLASHABLE.' >> reports/NOT_FLASHABLE.txt
            echo 'Diagnostic only: KernelSU objects may still fail due to incomplete manual hooks; not a full link.' >> reports/NOT_FLASHABLE.txt
            echo 'Only reboot object tested; all other manual hooks remain unverified. NOT FLASHABLE.' >> reports/NOT_FLASHABLE.txt
            exit 1
          fi
          make -C kernel O="$GITHUB_WORKSPACE/out" \
            CC=clang-14 LD=ld.lld-14 HOSTCC=gcc \
            AR=llvm-ar-14 NM=llvm-nm-14 \
            CLANG_TRIPLE=aarch64-linux-gnu- olddefconfig
          grep -qx 'CONFIG_KSU=y' out/.config || { echo "::error::KernelSU Next KSU config unavailable"; exit 1; }
          cp out/.config reports/kernel.config
          grep -E 'CONFIG_(ARCH_SM6150|MACH_R1Q|KPROBES|MODULES)=' out/.config \
            > reports/relevant-config.txt || true

      - name: Compile Android 11 KernelSU Next (experimental)
        run: |
          set -euo pipefail
          # Clang 14 treats Samsung's unused-but-set audio variable as -Werror.
          # Keep all other warnings classified normally; avoid DWARF5 parsing
          # spam from GNU objdump by generating DWARF4 with Clang 14.
          WARNFLAGS='-Wno-error=unused-but-set-variable -gdwarf-4'
          make -C kernel O="$GITHUB_WORKSPACE/out" \
            CC=clang-14 LD=ld.lld-14 HOSTCC=gcc \
            AR=llvm-ar-14 NM=llvm-nm-14 \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            KCFLAGS="$WARNFLAGS" -j4 2>&1 | tee reports/build.log
          find out/arch/arm64/boot -maxdepth 3 -type f \
            \( -name Image -o -name Image.gz -o -name Image.gz-dtb \) \
            -printf '%p %s bytes\n' | tee reports/images.txt
          test -s reports/images.txt

      - name: Collect kernel build results (NOT for flashing)
        if: always()
        run: |
          set -euo pipefail
          mkdir -p output
          if [[ -d out/arch/arm64/boot ]]; then
            for name in Image Image.gz Image.gz-dtb; do
              [[ ! -s "out/arch/arm64/boot/$name" ]] || \
                cp "out/arch/arm64/boot/$name" output/
            done
          fi
          cp reports/NOT_FLASHABLE.txt output/ 2>/dev/null || true
          echo '## Galaxy A80 Samsung source baseline test' >> "$GITHUB_STEP_SUMMARY"
          echo 'Source: A805FXXU7DXE1, kernel 4.14.190.' >> "$GITHUB_STEP_SUMMARY"
          echo '**NOT flashable. KernelSU Next experimental integration; NOT validated.**' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs, defconfig, and test images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a80-samsung11-ksunext-${{ github.run_number }}
          path: |
            reports/
            output/
          retention-days: 14
          if-no-files-found: warn
